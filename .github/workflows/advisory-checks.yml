# Advisory checks for the staging -> main flow.
#
# Branch protection is not available for this repository's plan, so nothing
# here can block a merge or a direct push. These jobs only mark a pull request
# or a commit red so the team can see a problem before it reaches main.
#
# Flow: feature branch -> pull request into staging -> pull request from
# staging into main.
name: Advisory checks

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  # Lets the live AI check be rerun by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    name: Main only takes pull requests from staging
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "staging" ]; then
            echo "::error::Pull requests into main must come from staging. Retarget this pull request to staging, then open a pull request from staging into main."
            exit 1
          fi
          echo "Source branch is staging."

  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  sanity:
    name: Sanity checks on the built app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Headless Chromium for the browser check in sanity/app.sanity.test.ts.
      - name: Install the browser
        run: npx playwright install --with-deps --only-shell chromium

      # The data checks in sanity/data.sanity.test.ts import the Python scripts
      # in scripts/ (standard library only, Python 3.9 or later, no network).
      - name: Check Python is available
        run: python3 --version

      - name: Build
        run: npm run build

      # Repository hygiene, the change log, the build output, the generated
      # data files and the scripts that write them, and the built app driven
      # through its main flow in a real browser. Every file matching
      # sanity/**/*.sanity.test.ts is run.
      - name: Sanity checks
        run: npm run test:sanity

  # The unit tests and sanity checks replace the model with canned answers, so
  # they run without a key. This job asks the real model the five SYNTHETIC
  # test reports and compares its readings with what is expected, then asks it
  # for a suggestion on three simulated shipments and checks each one.
  # The key is the repository secret LLM_API_KEY; the address and model are
  # repository variables. Pull requests from forks get no secret and skip.
  ai-live:
    name: Live AI check on the test reports and suggestions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KEY: ${{ secrets.LLM_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Skipped, no key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::LLM_API_KEY is not available to this run, so the live AI check was skipped."

      # The Bolt path uses Node only, but the Claude path needs its SDK, so
      # install either way. Lifecycle scripts are not needed here.
      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: npm ci --ignore-scripts

      # The script never prints the key.
      - name: Ask the model
        if: env.HAS_KEY == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # A secret, not a variable: variables are printed in the log, and the
          # log is public once the repository is.
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: npm run ai:tests -- --check
